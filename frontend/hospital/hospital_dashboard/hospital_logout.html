<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Logout | MedVisionAI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="hospital_logout.css"
    >

</head>


<body>

    <div class="logout-page">

        <div class="logout-card">

            <div class="logout-icon">

                <i class="bi bi-box-arrow-right"></i>

            </div>


            <h2>
                Logging Out
            </h2>


            <p>
                You are being securely logged out
                of the MedVisionAI Hospital Portal.
            </p>


            <div class="loading-bar">

                <div class="loading-progress"></div>

            </div>


            <span class="redirect-text">
                Redirecting to hospital login...
            </span>

        </div>

    </div>


    <script src="hospital_logout.js"></script>

</body>

</html>
