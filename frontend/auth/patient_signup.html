<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Signup | MedVisionAI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/login.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- LEFT -->

<div class="col-lg-5 left-section d-flex align-items-center">

<div class="content">

<h1>Create Your Account</h1>

<p>

Join MedVisionAI and manage your complete medical journey using Artificial Intelligence.

</p>

<img src="https://cdn-icons-png.flaticon.com/512/2966/2966488.png"
class="doctor-img">

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-7 d-flex align-items-center justify-content-center">

<div class="signup-card">

<h2 class="mb-4 text-primary fw-bold">

Patient Registration

</h2>

<div id="formMessage" class="alert d-none"></div>

<form id="patientSignupForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>Full Name</label>

<input
type="text"
class="form-control"
id="patientName"
name="name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
id="patientEmail"
name="email"
required>

</div>

<div class="col-md-6 mb-3">

<label>Phone Number</label>

<input
type="tel"
class="form-control"
id="patientPhone"
name="phone"
required>

</div>

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
id="patientPassword"
name="password"
required>

</div>

<div class="col-md-4 mb-3">

<label>Age</label>

<input
type="number"
class="form-control">
id="patientAge"
name="age"

</div>

<div class="col-md-4 mb-3">

<label>Gender</label>

<select id="patientGender" name="gender" class="form-control">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label>Blood Group</label>

<select id="patientBloodGroup" name="blood_group" class="form-control">

<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>AB+</option>
<option>AB-</option>
<option>O+</option>
<option>O-</option>

</select>

</div>

<div class="col-12 mb-3">

<label>Address</label>

<textarea
class="form-control"
id="patientAddress"
name="address"
rows="3"></textarea>

</div>

<div class="col-md-6 mb-3">

<label>Emergency Contact</label>

<input
type="tel"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label>Profile Photo</label>

<input
type="file"
class="form-control"
accept="image/*">

</div>

<div class="col-12 mb-3">

<label>Existing Medical History</label>

<textarea
class="form-control"
rows="4"
placeholder="Diabetes, BP, Asthma, Allergies etc."></textarea>

</div>

<div class="col-12">

<button
class="btn btn-primary w-100">

Create Account

</button>

</div>

</div>

</form>

<br>

<p class="text-center">

Already have an account?

<a href="patient_login.html">

Login Here

</a>

</p>

</div>

</div>

</div>

</div>

</body>

</html>
